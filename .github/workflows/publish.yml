# Publishes @agentdrives/cli to npm when a version tag (v0.1.1) is pushed. No npm token: npm trusts this workflow
# (Trusted Publishing over OpenID Connect) and signs where the package was built (provenance).
name: Publish to npm
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: The tag matches the version
        run: |
          v="$(node -p "require('./package.json').version")"
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME, package.json $v"; exit 1; }
          [ "$(node bin/agentdrives.mjs --version)" = "$v" ] || { echo "lib/version.mjs differs from package.json"; exit 1; }
      - name: Publish
        run: npm publish --access public --provenance
